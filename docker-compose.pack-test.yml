services:
  directus-pack-test:
    build:
      context: .
      dockerfile: Dockerfile.pack-test
      args:
        DIRECTUS_VERSION: ${DIRECTUS_VERSION:-11.5.1}
    environment:
      HOST: "0.0.0.0"
      KEY: "test-key-pack-integration"
      SECRET: "test-secret-pack-integration"
      EXTENSIONS_AUTO_RELOAD: "true"

      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/tmp/data/directus.db"

      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_CREDENTIALS: "true"

      ADMIN_EMAIL: "admin@pack-test.com"
      ADMIN_PASSWORD: "admin123"

      PUBLIC_URL: "http://localhost:18056"
      CACHE_ENABLED: "false"

      # Log level mais verboso para verificar carregamento da extensão
      LOG_LEVEL: "debug"
    ports:
      - 18056:8055
    tmpfs:
      - /directus/uploads:rw,noexec,nosuid,size=64M,mode=777
      - /tmp/data:rw,noexec,nosuid,size=64M
    networks:
      - directus-pack-test-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  directus-pack-test-network:
    driver: bridge
    name: directus-file-zip-pack-test-network

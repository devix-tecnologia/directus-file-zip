name: Release

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Use CI npmrc
        run: cp .npmrc.ci .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Security audit
        run: pnpm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Use CI npmrc
        run: cp .npmrc.ci .npmrc
      - run: pnpm install --frozen-lockfile
      - name: Start Docker Compose
        run: docker compose -f docker-compose.test.yml up -d
      - name: Run tests
        run: pnpm test
      - name: Docker logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down

  update-directus-versions:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Use CI npmrc
        run: cp .npmrc.ci .npmrc
      - run: pnpm install --frozen-lockfile
      - name: Update Directus versions in tests
        env:
          DIRECTUS_VERSION_MIN_AGE_DAYS: ${{ vars.DIRECTUS_VERSION_MIN_AGE_DAYS || '7' }}
        run: node .github/scripts/updateDirectusVersions.js
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update directus versions in tests'
          title: 'chore: update directus versions in tests'
          body: 'Automated update of Directus versions for testing'
          branch: 'update-directus-versions'
          delete-branch: true

  release:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Use CI npmrc
        run: cp .npmrc.ci .npmrc
      - run: pnpm install --frozen-lockfile
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --access public

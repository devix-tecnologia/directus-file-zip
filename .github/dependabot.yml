version: 2
updates:
  # NPM dependencies are now managed by Renovate (see renovate.json)
  # Renovate provides better age filtering and grouping capabilities
  
  # GitHub Actions - weekly checks
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - 'github-actions'
